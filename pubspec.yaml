name: idrone
description: "iDrone — Agricultura de precisión como servicio."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Supabase & Backend
  supabase_flutter: ^2.6.0

  # Maps & Geospatial
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # PDF & Documents
  pdf: ^3.10.8
  printing: ^5.13.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  file_picker: ^8.0.6
  flutter_dotenv: ^5.1.0

  # Models & JSON
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - .env.example
    - assets/images/
    - assets/icons/
